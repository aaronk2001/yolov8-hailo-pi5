name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Lint
        run: uvx ruff check .
      - name: Test
        # Hailo runtime is apt-only and needs the NPU; tests cover decode, draw and tracking.
        run: uv run --no-project --with numpy --with opencv-python-headless --with "supervision==0.27.0.post2" --with pytest pytest -v

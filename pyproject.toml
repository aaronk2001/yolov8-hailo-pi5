[project]
name = "yolov8-hailo-pi5"
version = "1.0.1"
description = "Real-time YOLOv8 object detection + ByteTrack on Raspberry Pi 5 with a Hailo-8L NPU"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
